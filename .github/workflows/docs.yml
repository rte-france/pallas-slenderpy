name: Docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # pages are frozen; the limit stops a build that would execute them
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install .[docs,test] "genbadge[coverage]"
      - name: Tests with coverage
        run: pytest test -q --cov=slenderpy --cov-report=html --cov-report=xml
      - name: Render the site
        working-directory: doc
        run: |
          quartodoc build
          quartodoc interlinks
          quarto render
      - name: Add the coverage report and badge
        run: |
          mkdir -p doc/_site/coverage
          cp -r htmlcov/. doc/_site/coverage/
          genbadge coverage -i coverage.xml -o doc/_site/coverage/badge.svg
      - uses: actions/upload-pages-artifact@v5
        with:
          path: doc/_site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
