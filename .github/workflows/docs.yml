name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install .[docs,test] "genbadge[coverage]"
      - name: Tests with coverage
        run: pytest test -q --cov=slenderpy --cov-report=html --cov-report=xml
      - name: Render the site
        working-directory: doc
        run: |
          quartodoc build
          quartodoc interlinks
          quarto render
      - name: Add the coverage report and badge
        run: |
          mkdir -p doc/_site/coverage
          cp -r htmlcov/. doc/_site/coverage/
          genbadge coverage -i coverage.xml -o doc/_site/coverage/badge.svg
      - uses: actions/upload-pages-artifact@v5
        with:
          path: doc/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
